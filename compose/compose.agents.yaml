# Agent work stack: a SECOND EveJS world, isolated from the owner's play server.
#
# The owner's stack is compose project `evejs` (compose.yaml, host ports
# 127.0.0.1:443/5222/26000-26002/40110, volumes evejs-data/evejs-images).
# Coding agents must never restart it while he plays, so their live proofs run
# here instead:
#
#   docker compose -p evejs-agents --project-directory <Code> \
#     -f compose.yaml -f compose.coop-probe.yaml -f compose/compose.agents.yaml up -d
#
# `!override` replaces the upstream port list instead of appending to it: with
# plain merging Compose would try to bind 26000-26002 again and collide with the
# owner's running server. Volume names are overridden for the same reason - the
# upstream file pins `name: evejs-data`, which a second project would otherwise
# share, corrupting the owner's world.
services:
  market:
    ports: !override
      - "127.0.0.1:41110:40110"
  server:
    ports: !override
      - "127.0.0.1:28443:26003"
      - "127.0.0.1:25222:5222"
      - "127.0.0.1:28000:26000"
      - "127.0.0.1:28001:26001"
      - "127.0.0.1:28002:26002"
    environment:
      # Marks every event line as produced by the agent stack, never the owner's.
      EVEJS_COOP_STACK: agents
      # x5 time acceleration for AGENT TESTING ONLY. These are knobs the code
      # already reads, so the play stack keeps stock pacing untouched:
      #   travel leg 120 s -> 24 s, clone recovery 30 min -> 6 min,
      #   manufacturing duration x0.2 (the module's own floor, = 5x faster).
      # Nothing here fakes a state change; it only shortens real durations.
      EVEJS_COOP_TIME_SCALE: "5"
      EVEJS_COOP_VIRTUAL_TRAVEL_MS: "24000"
      EVEJS_COOP_CLONE_RECOVERY_MS: "360000"
      EVEJS_COOP_MANUFACTURING_TIME_MULTIPLIER: "0.2"
      # Phase timing on the work stack, so optimisation claims are measured.
      EVEJS_COOP_PERF_METRICS: "1"
      # The agent world seeds only Jita (30000142) and New Caldari (30000145).
      # Perimeter (30000144) has ZERO seeded bids, so a fleet based there mines ore
      # nobody can buy and the whole loop stalls at the sale. Every agent fleet is
      # therefore based where its ore is really bought. Play stack untouched.
      EVEJS_MINING_NPC_STARTUP_SYSTEM_IDS: "30000142,30000145"
      # The governor stays ON here, but a small test world must not be throttled by a
      # modest backlog: 58k units against one station's 25k bid is not "overstock" on
      # a fresh economy, it is a normal buffer. The play stack keeps the 20 000 floor.
      EVEJS_COOP_MINING_DEMAND_FLOOR: "200000"
      # Measured 2026-10-28: the governor held 705 484 units against this allowance,
      # and a held fleet also stops the only thing that could sell them (a station
      # arrival). The drain flies an idle hauler to the station that holds the most
      # refined minerals, lifts them into its real hold and sells them, then returns.
      # Agent stack only until the owner has seen it work.
      EVEJS_COOP_STATION_DRAIN: "1"
      # Temporary, agent-only: name the treasury decision when the corporation is not
      # funded, so "moved 0" can never masquerade as a healthy sweep.
      EVEJS_COOP_TREASURY_TRACE: "1"
      # Agent-mission waves 2..N carry an empty triggerMessages list, so the client is
      # never told a wave exists (measured on Gone Berserk: 7 waves, 24 hulls, 250 LP).
      # Announce the real wave, and cap the chain to 3 waves for live proof here only.
      EVEJS_COOP_MISSION_WAVE_NOTIFY: "1"
      EVEJS_COOP_MISSION_WAVE_CAP: "3"
      # Measured 2026-10-27: with no client logged in, a scene that has no native
      # controller deadline is put to sleep by stock cold-scene sleep, so
      # `scene.tick()` never runs. The tick profiler then shows our overlay phases
      # (npc-reconcile:*, observed-native-mining) and NO "mining"/"npc" section:
      # the stock mining tick cannot fire, ships sit in mode STOP and no ore is
      # ever cut. This is the stock native switch that keeps a scene ticking
      # without sessions, which is exactly what a headless work world is.
      EVEJS_DISABLE_NPC_COLD_SCENE_SLEEP: "1"
      # FW seeding (2026-10-28): the war needs FREE roster identities to crew real
      # navy patrols on both sides of a border. The default 12-pilot world has ten
      # already linked to the mining fleet, so a war could never be staffed. The
      # virtual world tops the roster up on boot without wiping pilot history.
      EVEJS_COOP_VIRTUAL_POPULATION: "64"
      # FW N5 (2026-10-28): a garrison replacement hull must be paid for by the
      # campaign chest (FW-005B, real earned ISK only). Without it a garrison
      # refilled on cooldown forever, so the defending side never held zero live
      # hulls and the force capture (FW-035) could only answer
      # DEFENDER_STILL_PRESENT. Work stack ONLY: the owner's live world keeps the
      # old free-refill behaviour until he accepts the cost.
      EVEJS_COOP_WAR_GARRISON_FUNDED: "1"
      # Profiling runs only: a V8 CPU profile of the sim loop, 1 ms sampling.
      # Writes /var/lib/evejs/prof/*.cpuprofile inside the work stack volume.
      # Remove this line for normal agent runs.
      NODE_OPTIONS: "--cpu-prof --cpu-prof-dir=/var/lib/evejs/prof --cpu-prof-interval=1000"
volumes:
  evejs-data:
    name: evejs-agents-data
  evejs-images:
    name: evejs-agents-images
