# Agent work stack: a SECOND EveJS world, isolated from the owner's play server.
#
# The owner's stack is compose project `evejs` (compose.yaml, host ports
# 127.0.0.1:443/5222/26000-26002/40110, volumes evejs-data/evejs-images).
# Coding agents must never restart it while he plays, so their live proofs run
# here instead:
#
#   docker compose -p evejs-agents --project-directory <Code> \
#     -f compose.yaml -f compose.coop-probe.yaml -f compose/compose.agents.yaml up -d
#
# `!override` replaces the upstream port list instead of appending to it: with
# plain merging Compose would try to bind 26000-26002 again and collide with the
# owner's running server. Volume names are overridden for the same reason - the
# upstream file pins `name: evejs-data`, which a second project would otherwise
# share, corrupting the owner's world.
services:
  market:
    ports: !override
      - "127.0.0.1:41110:40110"
  server:
    ports: !override
      - "127.0.0.1:28443:26003"
      - "127.0.0.1:25222:5222"
      - "127.0.0.1:28000:26000"
      - "127.0.0.1:28001:26001"
      - "127.0.0.1:28002:26002"
    environment:
      # Marks every event line as produced by the agent stack, never the owner's.
      EVEJS_COOP_STACK: agents
      # x5 time acceleration for AGENT TESTING ONLY. These are knobs the code
      # already reads, so the play stack keeps stock pacing untouched:
      #   travel leg 120 s -> 24 s, clone recovery 30 min -> 6 min,
      #   manufacturing duration x0.2 (the module's own floor, = 5x faster).
      # Nothing here fakes a state change; it only shortens real durations.
      EVEJS_COOP_TIME_SCALE: "5"
      # FW payout (2026-10-28): a bounty escrow can only be reserved before a
      # campaign starts, so proving PAYOUT needs one NEW front. Every border the
      # world already tracked had a live campaign; these two systems are the real
      # stargate neighbours of the captured 30045344, so the world can derive a
      # fresh front from real travel instead of a hand-made record.
      EVEJS_COOP_VIRTUAL_ROUTE: "30000142,30000144,30000145,30045344,30003837,30003836,30003839,30045343,30045342,30045339,30045340,30045341,30045338,30003829,30003838,30045320"
      EVEJS_COOP_VIRTUAL_TRAVEL_MS: "24000"
      EVEJS_COOP_CLONE_RECOVERY_MS: "360000"
      EVEJS_COOP_MANUFACTURING_TIME_MULTIPLIER: "0.2"
      # Phase timing on the work stack, so optimisation claims are measured.
      EVEJS_COOP_PERF_METRICS: "1"
      # The agent world seeds only Jita (30000142) and New Caldari (30000145).
      # Perimeter (30000144) has ZERO seeded bids, so a fleet based there mines ore
      # nobody can buy and the whole loop stalls at the sale. Every agent fleet is
      # therefore based where its ore is really bought. Play stack untouched.
      EVEJS_MINING_NPC_STARTUP_SYSTEM_IDS: "30000142,30000145"
      # The governor stays ON here, but a small test world must not be throttled by a
      # modest backlog: 58k units against one station's 25k bid is not "overstock" on
      # a fresh economy, it is a normal buffer. The play stack keeps the 20 000 floor.
      EVEJS_COOP_MINING_DEMAND_FLOOR: "200000"
      # Measured 2026-10-28: the governor held 705 484 units against this allowance,
      # and a held fleet also stops the only thing that could sell them (a station
      # arrival). The drain flies an idle hauler to the station that holds the most
      # refined minerals, lifts them into its real hold and sells them, then returns.
      # Agent stack only until the owner has seen it work.
      EVEJS_COOP_STATION_DRAIN: "1"
      # Manufacturing: the corporation buys/produces real goods from native blueprint
      # recipes (materials really leave the hangar, the product really appears), and a
      # manufactured item is the cargo the drain sells first.
      EVEJS_COOP_NPC_MANUFACTURE: "1"
      # Distribution: the loop can decide what to ship to a system that really bids (Jita
      # 30000142 is one reciprocal gate from New Caldari 30000145) and advance an
      # operator-journaled gate crossing with the native transfer's own verdict. It never
      # plans or starts a crossing by itself, and ARRIVED needs full native proof.
      EVEJS_COOP_DISTRIBUTION: "1"
      # One real freight trip: lift at the origin station (what the DESTINATION pays for),
      # cross the gate with the proven native transfer, sell on arrival. Agent stack only.
      EVEJS_COOP_DISTRIBUTION_RUN: "1"
      # After a sale the hull goes home and takes another load, instead of sitting in the
      # buyer system with an empty hold (bounded to MAX_TRIPS per run).
      EVEJS_COOP_DISTRIBUTION_CYCLE: "1"
      # Blueprints: the corporation owned four and could never grow new products, while the
      # seeded world sells 2 772 of them from station stock. A hull that has just sold at the
      # buyer station may buy ONE, with real ISK, through the native trader (seeded ask only).
      EVEJS_COOP_BLUEPRINT_PURCHASE: "1"
      # Payroll: the market settles a purchase out of the PILOT's earned balance and the
      # treasury sweep empties every pilot after each sale, so the corporation pays its own
      # pilot from its real wallet instead of holding 1.45 billion nobody can spend.
      EVEJS_COOP_NPC_PAYROLL: "1"
      # Importing inputs: one purchase is bounded by units and spaced by a cooldown, so a
      # 481-unit Pyerite import needs many small honest trades. 30 s is the module's own floor.
      EVEJS_COOP_NPC_MARKET_MAX_QTY: "20"
      EVEJS_COOP_NPC_MARKET_COOLDOWN_MS: "30000"
      # One run of each demand-backed recipe is what the reserve has to protect.
      EVEJS_COOP_INPUT_RUNS: "1"
      # A shopping trip: an empty hull flies to the station that really sells the missing input,
      # buys it through the native trader and carries it home to the factory hangar.
      EVEJS_COOP_INPUT_IMPORT_TRIP: "1"
      EVEJS_COOP_BLUEPRINT_PRICE_CAP: "500000"
      EVEJS_COOP_BLUEPRINT_BUDGET: "5000000"
      # The economic phases get their own beat: measured 2026-10-29, the stock hook ran at
      # 23:30:26 and then not for eight minutes while a journaled crossing waited 6 km from
      # its gate. A phase that only runs when another system happens to call it is not a
      # phase. Default OFF everywhere except this probe stack.
      EVEJS_COOP_LOOP_DRIVER: "1"
      EVEJS_COOP_LOOP_INTERVAL_MS: "20000"
      # 1800 s of native job time is 3.6 s here, so a proof does not wait half an hour.
      EVEJS_COOP_INDUSTRY_TIME_SCALE: "0.002"
      # The lift carries any corp-owned stack the station really bids for, not only the
      # refinery's minerals, so a manufactured module reaches the market the same way.
      EVEJS_COOP_LIFT_ANY_TYPE: "1"
      # Temporary, agent-only: name the treasury decision when the corporation is not
      # funded, so "moved 0" can never masquerade as a healthy sweep.
      EVEJS_COOP_TREASURY_TRACE: "1"
      # Agent-mission waves 2..N carry an empty triggerMessages list, so the client is
      # never told a wave exists (measured on Gone Berserk: 7 waves, 24 hulls, 250 LP).
      # Announce the real wave, and cap the chain to 3 waves for live proof here only.
      EVEJS_COOP_MISSION_WAVE_NOTIFY: "1"
      EVEJS_COOP_MISSION_WAVE_CAP: "3"
      # Measured 2026-10-27: with no client logged in, a scene that has no native
      # controller deadline is put to sleep by stock cold-scene sleep, so
      # `scene.tick()` never runs. The tick profiler then shows our overlay phases
      # (npc-reconcile:*, observed-native-mining) and NO "mining"/"npc" section:
      # the stock mining tick cannot fire, ships sit in mode STOP and no ore is
      # ever cut. This is the stock native switch that keeps a scene ticking
      # without sessions, which is exactly what a headless work world is.
      EVEJS_DISABLE_NPC_COLD_SCENE_SLEEP: "1"
      # FW seeding (2026-10-28): the war needs FREE roster identities to crew real
      # navy patrols on both sides of a border. The default 12-pilot world has ten
      # already linked to the mining fleet, so a war could never be staffed. The
      # virtual world tops the roster up on boot without wiping pilot history.
            # FW-083 (measured): the 64-pilot roster was fully subscribed - 65 links, every one
      # holding a live hull - so the war could not staff a fresh front at all ("free = -1").
      # The war shares the roster with mining, hauling and trading, and each campaign needs
      # up to four hulls per side. 88 leaves room for a front and its replacements.
      EVEJS_COOP_VIRTUAL_POPULATION: "88"
      # FW N5 (2026-10-28): a garrison replacement hull must be paid for by the
      # campaign chest (FW-005B, real earned ISK only). Without it a garrison
      # refilled on cooldown forever, so the defending side never held zero live
      # hulls and the force capture (FW-035) could only answer
      # DEFENDER_STILL_PRESENT. Work stack ONLY: the owner's live world keeps the
      # old free-refill behaviour until he accepts the cost.
      EVEJS_COOP_WAR_GARRISON_FUNDED: "1"
      # FW-005C (2026-10-28): the pilot-earned levy is starved by the refinery
      # treasury sweep, which already moved those ISK into the corporation
      # wallet. Opt-in: when the levy plans zero, back the bounty escrow with
      # that same native wallet (coopWarTreasury verifies and debits it, so no
      # ISK is created). Work stack only until the owner accepts it.
      EVEJS_COOP_WAR_BOUNTY_WALLET_FALLBACK: "1"
      # FW-046 (2026-10-28): a reservation used to be taken for ONE side only, so
      # a defender kill could never be paid (measured 19:15Z: real kill by 500011,
      # escrow HELD for 500004, payout refused NO_HELD_ESCROW_FOR_FACTION). Each
      # side now funds its own bounty from its own wallet; a side that cannot pay
      # is refused per side and never blocks the other. Opt-in, work stack only.
      EVEJS_COOP_WAR_BOUNTY_BOTH_SIDES: "1"
      # FW-005B (2026-10-28): this stack ran with REQUIRE_FUNDING=0, i.e. a
      # campaign could open with a paper supply and no escrow, so no bounty could
      # ever be paid. Require real money: a campaign now opens only if both war
      # parties really reserve a HELD escrow (wallet-backed above), which is the
      # only way PAYOUT can be observed. Work stack only.
      EVEJS_COOP_WAR_REQUIRE_FUNDING: "1"
      # FW-086 (measured): a militia corporation earns nothing on its own, and every
      # campaign reserves the default 25 000 ISK per side, so after a day of fighting the
      # wallets sit at 5 000 and FW-068 correctly refuses every border. The bounty on this
      # stack is therefore priced at 5 000 ISK: real escrow, real debit, real payout, but
      # small enough that the existing militia income can carry a war.
      EVEJS_COOP_WAR_BOUNTY_ISK: "5000"
      # FW-091/FW-095 (measured): the stall window was 45 minutes, which on this stack ate
      # an evening per retry. Ten minutes then proved too short: measured at 19:32Z a border
      # opened, its hulls arrived at 19:39-19:42, and the campaign expired before the first
      # assault tick. The pipeline is wall-clock (one phase per tick), not simulated time, so
      # the window is 25 minutes - enough for open -> stage -> jump -> assault -> kill,
      # and still a fifth of the original.
      EVEJS_COOP_WAR_OPENING_STALL_MS: "1500000"
      # FW-096 (owner decision 2026-10-30): enlistment is not free - the native rule
      # accepts a raw 0.0 standing. "0" stays the default everywhere; this stack asks
      # for 1.5 because the owner's own Caldari standing is 1.553 today, so 2.0 would
      # lock him out while 1.5 keeps the rule real.
      EVEJS_COOP_FW_ENLIST_MIN_STANDING: "1.5"
      # FW-038B (2026-10-28): allow a funded faction to hire a navy with a real,
      # journaled two-leg wallet transfer (division 1000). The world measured this
      # asymmetry: ORE holds 136.5 M ISK and cannot field a hull, while every
      # navy-capable faction holds 0 ISK. Work stack only.
      # DISABLED 2026-10-28 after a measured failure: the settlement journal row
      # vanished between transactions, so a replayed event paid again and one leg
      # was destroyed (25 000 ISK). Idempotency must be anchored in a durable
      # record (wallet/treasury), not in a row that can disappear, so no money may
      # move until that is fixed. Keep 0.
      EVEJS_COOP_WAR_MERCENARY_CONTRACT: "1"
      EVEJS_COOP_COMPONENT_MARKET: "1"
      # Profiling runs only: a V8 CPU profile of the sim loop, 1 ms sampling.
      # Writes /var/lib/evejs/prof/*.cpuprofile inside the work stack volume.
      # Remove this line for normal agent runs.
      NODE_OPTIONS: "--cpu-prof --cpu-prof-dir=/var/lib/evejs/prof --cpu-prof-interval=1000"
volumes:
  evejs-data:
    name: evejs-agents-data
  evejs-images:
    name: evejs-agents-images
