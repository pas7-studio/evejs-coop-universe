name: Faction War Recovery Source Tests
on:
  pull_request:
    paths:
      - 'integration/coopWar*.cjs'
      - 'integration/coopFactionWarAgent.cjs'
      - 'integration/coopVirtualWorldRuntime.cjs'
      - 'scripts/coop-war-structure-killmail-patch.cjs'
      - 'integration/coopNativeGateTransfer.cjs'
      - 'integration/coopIdentityRegistry.cjs'
      - 'tests/coop-war-*.test.mjs'
      - '.github/workflows/fw-war-recovery-source.yml'
  push:
    branches:
      - 'feat/fw-007c-guarded-war-recovery-20261026'
    paths:
      - 'integration/coopWar*.cjs'
      - 'tests/coop-war-*.test.mjs'
      - '.github/workflows/fw-war-recovery-source.yml'
permissions:
  contents: read
jobs:
  node-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check recovery sources and operator CLI
        run: |
          node --check integration/coopWarTransferLedger.cjs
          node --check integration/coopWarRecoveryConsole.cjs
          node --check integration/coopWarRecoverySocket.cjs
          node --check integration/coopWarGateHandoff.cjs
          node --check integration/coopWarDemobilizer.cjs
          node --check integration/coopWarFleetRegistry.cjs
          node --check integration/coopVirtualWorldRuntime.cjs
          node --check integration/coopWarNativeStructureControl.cjs
          node --check integration/coopWarObjectiveAdjudicator.cjs
          node --check integration/coopWarNativeStructureCombatProof.cjs
          node --check integration/coopWarObjectiveDirector.cjs
          node --check integration/coopWarMilitiaIntel.cjs
          node --check integration/coopFactionWarAgent.cjs
          node --check scripts/coop-war-structure-killmail-patch.cjs
          node --check scripts/coop-war-recovery-cli.cjs
      - name: Native handoff and protected recovery tests
        run: |
          node --test tests/coop-war-transfer-ledger.test.mjs \
            tests/coop-war-gate-handoff.test.mjs \
            tests/coop-war-recovery-console.test.mjs \
            tests/coop-war-recovery-socket.test.mjs \
            tests/coop-war-fleet-registry.test.mjs \
            tests/coop-war-gate-staging.test.mjs \
            tests/coop-war-demobilizer.test.mjs \
            tests/coop-war-fleet-demobilization.test.mjs \
            tests/coop-war-objective-adjudicator.test.mjs \
            tests/coop-war-native-structure-control.test.mjs \
            tests/coop-war-structure-killmail-proof.test.mjs \
            tests/coop-war-objective-director.test.mjs \
            tests/coop-war-structure-killmail-patch.test.mjs \
            tests/coop-war-player-militia-presence.test.mjs \
            tests/coop-war-militia-intel.test.mjs \
            tests/coop-war-militia-agent-frontline.test.mjs \
            tests/coop-faction-war-agent.test.mjs
