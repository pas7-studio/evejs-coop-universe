name: NPC memory and faction contracts
on:
  pull_request:
  push:
    branches: [main]
jobs:
  npc-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check NPC runtime modules
        run: |
          node --check integration/coopNpcMemory.cjs
          node --check integration/coopNativeConsequences.cjs
          node --check integration/coopNpcTactics.cjs
          node --check integration/coopFactionDirector.cjs
          node --check integration/coopVirtualWorldRuntime.cjs
          node --check scripts/patch-evejs-coop.cjs
      - name: Unit-test real evidence and history contracts
        run: node --test tests/coop-npc-memory.test.mjs tests/coop-npc-tactics.test.mjs tests/coop-faction-director.test.mjs tests/coop-native-consequences.test.mjs
