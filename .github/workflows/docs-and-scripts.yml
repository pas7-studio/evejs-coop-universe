name: Repository safety checks
on:
  push:
  pull_request:
jobs:
  basic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Required docs and safety baseline
        shell: bash
        run: |
          set -eu
          test -f README.md
          test -f AGENTS.md
          test -f docs/FIRST_RUN.md
          test -f docs/ROADMAP.md
          test -f scripts/Preflight.ps1
          test -f scripts/Fetch-Upstream.ps1
          test -f scripts/Check-Backend.ps1
          test -f scripts/Audit-Network.ps1
          test -f scripts/Test-XEveBaseline.ps1
          test -f scripts/Test-ComposeSafety.ps1
          ! git ls-files | grep -E '(^|/)(\.env$|node_modules/|ResFiles/|blue\.dll$|.*\.(pem|pfx|sqlite3?|db)$)'
      - name: One-command backend runner is present
        shell: bash
        run: |
          test -f scripts/Verify-Local-Coop.ps1
          test -f docs/VERIFY_BACKEND_ONE_COMMAND.md

      - name: PowerShell parser check
        shell: pwsh
        run: |
          $errors = @()
          foreach ($file in (Get-ChildItem ./scripts -Filter '*.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { $errors += $parseErrors }
          }
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }

      - name: Test baseline compatibility guard
        shell: pwsh
        run: |
          $sample = Join-Path $env:RUNNER_TEMP 'baseline-fixture.bin'
          [System.IO.File]::WriteAllText($sample, 'evejs-coop-test-fixture')
          $correct = (Get-FileHash -Algorithm SHA256 $sample).Hash
          & ./scripts/Test-XEveBaseline.ps1 -ArchivePath $sample -ExpectedSha256 $correct
          if ($LASTEXITCODE -ne 0) { throw 'Expected a valid hash to pass' }
          # Expected failure must run in a child PowerShell process: Write-Error
          # with ErrorActionPreference=Stop can terminate the current CI step.
          & pwsh -NoProfile -NonInteractive -File ./scripts/Test-XEveBaseline.ps1 -ArchivePath $sample 2>&1 | Out-String | Write-Host
          $negativeExitCode = $LASTEXITCODE
          if ($negativeExitCode -eq 0) { throw 'Expected incompatible hash to fail' }

      - name: Syntax-check real backend transport smoke
        run: |
          node --check ./scripts/smoke-two-tcp.mjs
          node --test ./tests/smoke-two-tcp.test.mjs ./tests/coop-scene-audit.test.mjs ./tests/coop-reconnect-guard.test.mjs ./tests/coop-lifecycle-audit.test.mjs

      - name: Two independent TCP sessions (standalone test fixture)
        shell: bash
        run: |
          mkdir -p evidence
          set -o pipefail
          node --test ./lab/co-op-session-lab.test.mjs 2>&1 | tee evidence/lab-tests.log

      - name: Fetch pinned upstream registry for integration contract tests
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/evejs-upstream"
          git -C "$RUNNER_TEMP/evejs-upstream" init
          git -C "$RUNNER_TEMP/evejs-upstream" remote add origin https://github.com/gameboys84/EveJS.git
          git -C "$RUNNER_TEMP/evejs-upstream" fetch --depth 1 origin c3ea396b6761a0ed3e71ad5b8dd7507f9ae6d69f
          git -C "$RUNNER_TEMP/evejs-upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/evejs-upstream" rev-parse HEAD)" = c3ea396b6761a0ed3e71ad5b8dd7507f9ae6d69f
      - name: Install pinned upstream server dependencies
        shell: bash
        run: |
          set -eu
          cd "$RUNNER_TEMP/evejs-upstream/Code/server"
          npm ci --no-audit --no-fund
      - name: Test real EveJS session registry with two synthetic players
        env:
          EVEJS_CODE_PATH: ${{ runner.temp }}/evejs-upstream/Code
        shell: bash
        run: |
          mkdir -p evidence
          set -o pipefail
          node --test ./tests/upstream-session-registry.test.mjs ./tests/upstream-two-observers.test.mjs ./tests/upstream-ship-prime-recipients.test.mjs ./tests/upstream-two-observer-warp.test.mjs ./tests/upstream-two-pilot-lifecycle.test.mjs ./tests/upstream-two-pilot-movement-and-reconnect.test.mjs ./tests/upstream-coop-scene-audit.test.mjs ./tests/upstream-two-ship-projection.test.mjs ./tests/upstream-live-reconnect-contract.test.mjs 2>&1 | tee evidence/upstream-session-and-scene.log

      - name: Run upstream scene observer and movement parity checks
        env:
          EVEJS_SKIP_NPC_STARTUP: "1"
          EVEJS_DISABLE_NPC_ANCHOR_RELEVANCE: "1"
        shell: bash
        run: |
          set -eu
          cd "$RUNNER_TEMP/evejs-upstream/Code/server"
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          set -o pipefail
          {
            node scripts/verifyMovementRemovalParity.js
            node scripts/verifyJoltsObserverParity.js
            node scripts/verifyOwnerDamageMovementParity.js
            node scripts/verifyTargetKillModuleTeardown.js
            node scripts/verifyDestinyAuthorityDropAndFx.js
            node scripts/verifyMovementWarpParity.js
          } 2>&1 | tee "$GITHUB_WORKSPACE/evidence/upstream-regressions.log"

      - name: Persist verification manifest
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Project commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Upstream pinned commit: c3ea396b6761a0ed3e71ad5b8dd7507f9ae6d69f"
            echo "Node: $(node --version)"
            echo "Result: see individual preceding CI steps (this manifest is not a PASS signal)"
          } | tee evidence/manifest.txt
          cat evidence/manifest.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-verification-manifest
          path: evidence/
          if-no-files-found: error
