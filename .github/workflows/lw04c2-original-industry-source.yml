name: LW04C2 Original Native Industry Source
on:
  pull_request:
    branches:
      - main
      - feat/lw04c-native-industry-recovery-fence-20261026
    paths:
      - 'integration/coopNpcIndustryOriginal*.cjs'
      - 'tests/coop-npc-industry-original*.test.mjs'
      - 'tests/scenarios/lw04c2-original-manufacturing-stage-e2e.json'
      - '.github/workflows/lw04c2-original-industry-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-kernels:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax of manually guarded original stage modules
        run: |
          node --check integration/coopNpcIndustryOriginalStageExecutor.cjs
          node --check integration/coopNpcIndustryOriginalGameStorePreflight.cjs
      - name: Run genuine source GameStore kernel and recovery tests
        run: |
          node --test \
            tests/coop-npc-industry-original-stage-executor.test.mjs \
            tests/coop-npc-industry-original-game-store-kernel.test.mjs \
            tests/coop-npc-industry-recovery-fence.test.mjs \
            tests/coop-npc-live-factory-readiness.test.mjs \
            tests/coop-native-industry-overlay-graph.test.mjs
      - name: Assert physical native tests are not misreported
        run: |
          node -e 'const m=require("./tests/scenarios/lw04c2-original-manufacturing-stage-e2e.json");if(m.scenarios.length<10||m.scenarios.some(s=>s.status!=="NOT_RUN"))process.exit(1)'
